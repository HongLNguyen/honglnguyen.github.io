title: "Hong lam Nguyen"
description: "Welcome to my page. This is a personal space to share my journey as a computer scientist, science enthusiast, and caring individual. I am a recent graduate of University of Maryland with a B.S. and M.S. in Computer Science. I enjoy diving through the innerworkings of technological concepts as well as creating tangible products that are meaningful to human lives. After graduation, I am on a journey to discover new passions and broaden my perspective of the current world in relation to technology."
