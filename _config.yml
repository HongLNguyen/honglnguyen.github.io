title: "Hong Lam Nguyen"
description: "This is a personal space to share my journey as a computer scientist and intuitive individual. I am a recent graduate of University of Maryland with a B.S. and M.S. in Computer Science. I enjoy diving through the innerworkings of technological concepts as well as creating tangible products that are meaningful to our daily lives. After graduation, I am on a journey to explore new passions and broaden my perspective of the current world in relation to technology."
